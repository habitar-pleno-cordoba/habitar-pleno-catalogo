<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de productos · Habitar Pleno Córdoba</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,system-ui,sans-serif;color:#fff;background:transparent}
.catalog{width:100%;padding:12px 10px 20px;background:linear-gradient(155deg,#22233a,#34354e 62%,#1f283f)}
.toolbar{display:flex;gap:10px;margin:0 0 18px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1;min-width:170px;width:100%;padding:10px;border:1px solid #b8c4d0;border-radius:5px;background:#fff;color:#23313b;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 16px}
.product{min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.photo{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.06)}
.photo img{width:100%;height:100%;object-fit:contain}
.placeholder{padding:14px;font-size:13px;color:#eee}
.product h3{font-size:14px;font-weight:400;line-height:1.5;margin:10px 2px 12px;min-height:42px;overflow-wrap:anywhere}
.buy{display:block;margin-top:auto;background:#ffcf26;color:#1b2b22;border-radius:5px;padding:11px 5px;font-size:13px;font-weight:800;text-decoration:none}
.buy:hover,.buy:focus-visible{background:#ffe16a;outline:2px solid #fff;outline-offset:2px}
.disclosure{text-align:center;font-size:11px;color:#e4e8ec;margin:22px 0 0;line-height:1.5}
.empty{display:none;text-align:center;padding:24px;color:#fff}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.catalog{padding:10px}.product h3{font-size:13px}.buy{font-size:12px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.photo{max-width:280px;margin:auto}}
</style></head><body><main class="catalog" aria-label="Catálogo Habitar Pleno Córdoba">
<div class="toolbar"><input id="q" type="search" placeholder="Buscar productos..." aria-label="Buscar productos"><select id="cat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option><option value="Bienestar y confort">Bienestar y confort</option></select></div>
<section class="grid" id="grid"><article class="product" data-text="tensiómetro digital de brazo femmto kf-dt65s bienestar y confort" data-cat="Bienestar y confort"><div class="photo"><img src="imagenes/MLA76118504_publicidad.png" alt="Tensiómetro digital de brazo Femmto KF-DT65S" loading="lazy"></div><h3>Tensiómetro digital de brazo Femmto KF-DT65S</h3><a class="buy" href="https://meli.la/2v7oauR" target="_blank" rel="noopener noreferrer sponsored">COMPRALO AQUÍ</a></article></section><p class="empty" id="empty">No encontramos productos con esos filtros.</p>
<p class="disclosure">Los botones dirigen a Mercado Libre mediante enlaces de afiliado. Podemos recibir una comisión por compras elegibles. Verificá el precio y la disponibilidad en Mercado Libre.</p>
</main><script>
const q=document.getElementById('q'),cat=document.getElementById('cat'),items=[...document.querySelectorAll('.product')];
function normalize(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLocaleLowerCase('es')}
function filter(){let visible=0;items.forEach(item=>{const ok=normalize(item.dataset.text).includes(normalize(q.value))&&(!cat.value||item.dataset.cat===cat.value);item.hidden=!ok;if(ok)visible++});document.getElementById('empty').style.display=visible?'none':'block'}
q.addEventListener('input',filter);cat.addEventListener('change',filter);
</script></body></html>
